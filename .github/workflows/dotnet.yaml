name: Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: |
        dotnet restore
        dotnet tool restore
    - name: Build
      run: dotnet build --no-restore
    - name: Lint
      run: ./scripts/lint.sh
    - name: Test
      run: dotnet test --no-build --verbosity normal
